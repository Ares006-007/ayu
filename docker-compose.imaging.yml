version: '3.8'

services:
  imaging-api-cpu:
    build:
      context: ./apps/imaging-api
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=dev_access_key
      - S3_SECRET_KEY=dev_secret_key
      - S3_BUCKET=ayu-imaging-dev
      - S3_SECURE=false
    depends_on:
      - minio

  # The GPU image would be run conditionally based on the host
  # imaging-api-gpu:
  #   build:
  #     context: ./apps/imaging-api
  #     dockerfile: Dockerfile.gpu
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   ports:
  #     - "8001:8000"

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=dev_access_key
      - MINIO_ROOT_PASSWORD=dev_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
